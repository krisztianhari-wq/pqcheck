name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Generate fixtures
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          PQ_DEBUG=1 sh tests/fixtures/generate.sh > gen.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error title=fixture generation failed::$(tail -n 8 gen.log | tr '\n' ' | ')"
            cat gen.log; exit $rc
          fi
          cat gen.log
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Smoke test (Windows, no fixture toolchain)
        if: runner.os == 'Windows'
        run: |
          python -m pqcheck --version
          python -m pqcheck --no-color --fail-on never scan tests/fixtures/sshd_config tests/fixtures/app.py
