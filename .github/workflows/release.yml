name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sh build_pyz.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pqcheck-pyz
          path: dist/pqcheck.pyz

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: pqcheck-linux-x86_64
          - os: macos-latest
            asset: pqcheck-macos-arm64
          - os: macos-13
            asset: pqcheck-macos-x86_64
          - os: windows-latest
            asset: pqcheck-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build
        shell: bash
        run: |
          mkdir -p build
          printf 'import sys\nfrom pqcheck.cli import main\nsys.exit(main())\n' > build/entry.py
          pyinstaller --onefile --name pqcheck --clean --noconfirm --paths . --distpath dist --workpath build/pyi --specpath build build/entry.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/pqcheck.exe "dist/${{ matrix.asset }}"; else mv dist/pqcheck "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: [pyz, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
