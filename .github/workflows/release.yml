name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pyz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sh build_pyz.sh && mv dist/pqcheck.pyz dist/pqcheck-cli-any-python3.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: pqcheck-pyz
          path: dist/pqcheck-cli-any-python3.pyz

  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: pqcheck-cli-linux-x86_64
          - os: macos-latest
            asset: pqcheck-cli-macos-arm64
          - os: windows-latest
            asset: pqcheck-cli-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Build
        shell: bash
        run: |
          mkdir -p build
          printf 'import sys\nfrom pqcheck.cli import main\nsys.exit(main())\n' > build/entry.py
          pyinstaller --onefile --name pqcheck --clean --noconfirm --paths . --distpath dist --workpath build/pyi --specpath build build/entry.py
          if [ "$RUNNER_OS" = "Windows" ]; then mv dist/pqcheck.exe "dist/${{ matrix.asset }}"; else mv dist/pqcheck "dist/${{ matrix.asset }}"; fi
      - name: Smoke test
        shell: bash
        run: ./dist/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
      - name: Build desktop app (double-clickable, opens the GUI)
        shell: bash
        run: |
          sh build_app.sh
          mkdir -p dist/desktop
          case "$RUNNER_OS" in
            macOS)   cp dist/PQCheck-macos.zip dist/desktop/PQCheck-Desktop-macos-arm64.zip ;;
            Windows) cp dist/app/PQCheck.exe dist/desktop/PQCheck-Desktop-windows-x86_64.exe ;;
            Linux)   cp dist/app/PQCheck dist/desktop/PQCheck-Desktop-linux-x86_64 ;;
          esac
          ls -la dist/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.asset }}
          path: dist/desktop/*

  release:
    needs: [pyz, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: cd assets && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release (gh CLI; replaces any draft/previous release for this tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          cat > notes.md <<'MD'
          ## Which file do I need?

          | I want to… | Download | How to run |
          |---|---|---|
          | **double-click an app** on a Mac (Apple Silicon) | `PQCheck-Desktop-macos-arm64.zip` | unzip → `PQCheck.app` → Applications. First launch: see *Gatekeeper* in the README |
          | **double-click an app** on Windows | `PQCheck-Desktop-windows-x86_64.exe` | run it; SmartScreen → *More info* → *Run anyway* |
          | **double-click an app** on Linux | `PQCheck-Desktop-linux-x86_64` | `chmod +x`, run; opens the browser |
          | use the **command line** | `pqcheck-cli-<os>-<arch>` | `./pqcheck-cli-macos-arm64 web https://example.com` |
          | run it **with Python** (any OS) | `pqcheck-cli-any-python3.pyz` | `python3 pqcheck-cli-any-python3.pyz gui` |

          The desktop apps and the CLI are the same program: the app simply starts `pqcheck gui`.
          Verify downloads against `SHA256SUMS.txt`.

          MD
          gh release create "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --title "pqcheck $TAG" --notes-file notes.md --generate-notes --verify-tag
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
