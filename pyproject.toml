[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pqcheck"
version = "0.3.0"
description = "Quantum-readiness inventory: grade algorithms found in files, code, TLS and SSH endpoints"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pqcheck = "pqcheck.cli:main"

[tool.setuptools]
packages = ["pqcheck"]
